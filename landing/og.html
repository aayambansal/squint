<!doctype html>
<!--
  The social card. og.png is a 1200x630 capture of this file; regenerate it with
    chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=4000 \
      --screenshot=landing/og.png landing/og.html
  after changing the tagline or the palette in index.html.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<meta name="robots" content="noindex">
<title>squint social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: oklch(0.99 0.002 262);
    --ink: oklch(0.24 0.015 262);
    --graphite: oklch(0.45 0.015 262);
    --amber: oklch(0.76 0.132 75);
    --term-bg: oklch(0.21 0.015 265);
    --term-ink: oklch(0.93 0.005 262);
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--paper) radial-gradient(circle at 1px 1px, oklch(0.89 0.006 262) 1.2px, transparent 1.8px) 0 0 / 24px 24px;
    color: var(--ink); font-family: "Bricolage Grotesque", system-ui, sans-serif;
    padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .mark { display: flex; align-items: center; gap: 16px; font-size: 40px; font-weight: 800; letter-spacing: -0.02em; }
  h1 { font-size: 164px; font-weight: 800; font-stretch: 80%; letter-spacing: -0.012em; line-height: 0.9; }
  .cursor { display: inline-block; width: 0.3em; height: 0.72em; background: var(--amber); vertical-align: -0.02em; margin-left: 0.08em; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .cmd {
    font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 30px; font-weight: 500;
    background: var(--term-bg); color: var(--term-ink); border-radius: 16px; padding: 20px 28px;
  }
  .cmd span { color: var(--amber); }
  .foot p { font-size: 28px; color: var(--graphite); text-align: right; line-height: 1.3; }
</style>
</head>
<body>
  <div class="mark">
    <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#171a21"/><path d="M11 9l8 7-8 7" stroke="#e8a33d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    squint
  </div>
  <h1>Lovable for<br>your terminal.<span class="cursor"></span></h1>
  <div class="foot">
    <div class="cmd"><span>❯</span> npx @aayambansal/squint</div>
    <p>A frontend harness for the<br>coding agents you already have</p>
  </div>
</body>
</html>
